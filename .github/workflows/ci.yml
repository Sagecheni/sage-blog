# push / PR 时跑：类型检查 + lint + 构建（含 Pagefind 索引与死链检查）+ E2E 冒烟。
# 构建需要联网拉 COS 图片（image.domains 授权域），Actions 默认可出网。
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 必须放在 npm ci 之后 —— 它会清空 node_modules，先恢复会被删掉。
      # ms-playwright 是浏览器二进制（省 ~100MB 下载），
      # sageforge 是 DataV 地理数据（省一次外网依赖）
      - name: Restore Playwright browser & geo data cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            node_modules/.cache/sageforge
          key: ${{ runner.os }}-pw-geo-${{ hashFiles('package-lock.json') }}

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src scripts

      - name: Build (astro + pagefind + 死链检查)
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npx playwright test
